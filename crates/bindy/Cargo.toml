[package]
name = "bindy"
description = "BIND9 DNS Operator for Kubernetes"
keywords = ["kubernetes", "dns", "bind9", "operator", "operator"]
categories = ["network-programming", "web-programming"]
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
readme.workspace = true

# kube-runtime is used through `kube::runtime`; it is listed only to enable a feature.
[package.metadata.cargo-machete]
ignored = ["kube-runtime"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
bindy-api.workspace = true
bindy-controller-sdk.workspace = true
bindy-controller-cluster.workspace = true
bindy-controller-instance.workspace = true
bindy-controller-zone.workspace = true
bindy-controller-records.workspace = true
bindy-scout.workspace = true
bindy-bootstrap.workspace = true
kube.workspace = true
# Feature-only dependency: enables `unstable-runtime-stream-control` on the
# kube-runtime that `kube::runtime` re-exports (see the workspace Cargo.toml).
kube-runtime.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
k8s-openapi.workspace = true
rustls.workspace = true
axum.workspace = true
clap.workspace = true
clap_complete.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
