# Should be ACCEPTED by bindy-pod-shape-validation.
# ADR-0023, Decision 6: a rndcKey.secretRef naming a bindy- Secret, with the
# custom entry names the operator mirrors into {instance}-rndc-key.
apiVersion: bindy.firestoned.io/v1beta1
kind: Bind9Instance
metadata:
  name: vap-pod-shape-accept-rndc-bindy-secret
  namespace: bindy-system
spec:
  clusterRef: ""
  role: primary
  replicas: 1
  rndcKey:
    secretRef:
      name: bindy-corp-rndc
      keyNameKey: corp-key-name
      secretKey: corp-key
