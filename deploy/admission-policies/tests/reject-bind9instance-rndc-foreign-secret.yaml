# Should be REJECTED by bindy-pod-shape-validation.
# ADR-0023, Decision 6: the operator copies the key out of the Secret a
# rndcKey.secretRef names into the Secret the operand Pods mount, so a
# reference to a Secret without the bindy- prefix (here another tenant's TSIG
# key) is refused at admission.
apiVersion: bindy.firestoned.io/v1beta1
kind: Bind9Instance
metadata:
  name: vap-pod-shape-reject-rndc-foreign-secret
  namespace: bindy-system
spec:
  clusterRef: ""
  role: primary
  replicas: 1
  rndcKey:
    secretRef:
      name: other-tenant-tsig
