#
# Should be REJECTED by bindy-scout-source-binding: the account for edge-foo stamps another cluster's name (edge-bar).
# Needs tests/setup/scout-source-binding.yaml applied, and must be applied
# while impersonating the registered Scout ServiceAccount:
#
#   kubectl apply --dry-run=server --as=system:serviceaccount:bindy-system:scout-fixture \
#     -f reject-arecord-scout-foreign-cluster.yaml
#
apiVersion: bindy.firestoned.io/v1beta1
kind: ARecord
metadata:
  name: vap-reject-arecord-scout-foreign-cluster
  namespace: bindy-system
  labels:
    bindy.firestoned.io/managed-by: scout
    bindy.firestoned.io/source-cluster: edge-bar
    bindy.firestoned.io/zone: foo.example.com
spec:
  name: api
  ipv4Addresses:
    - "192.0.2.10"
