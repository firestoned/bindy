# Cargo workspace (ADR-0009). Every crate lives in crates/bindy-*; each
# dependency version is pinned once below and inherited with
# `dep.workspace = true`. The release workflow rewrites the
# `[workspace.package]` version line, so it must stay the only line in this
# file that starts with `version = `.
[workspace]
resolver = "2"
members = [
    "crates/bindy",
    "crates/bindy-api",
    "crates/bindy-bind9",
    "crates/bindy-bootstrap",
    "crates/bindy-controller-cluster",
    "crates/bindy-controller-instance",
    "crates/bindy-controller-records",
    "crates/bindy-controller-sdk",
    "crates/bindy-controller-zone",
    "crates/bindy-scout",
]

[workspace.package]
version = "0.7.1"
edition = "2021"
rust-version = "1.94"
authors = ["Erick Bourgeois <erick@jeb.ca>"]
license = "Apache-2.0"
repository = "https://github.com/firestoned/bindy"
documentation = "https://firestoned.github.io/bindy/"
homepage = "https://firestoned.github.io/bindy/"
readme = "README.md"

[workspace.lints.rust]
# The operator has no first-party unsafe code; enforce that at compile time.
unsafe_code = "forbid"

[workspace.dependencies]
# Workspace crates
bindy-api = { path = "crates/bindy-api" }
bindy-controller-sdk = { path = "crates/bindy-controller-sdk" }
bindy-bind9 = { path = "crates/bindy-bind9" }
bindy-controller-cluster = { path = "crates/bindy-controller-cluster" }
bindy-controller-instance = { path = "crates/bindy-controller-instance" }
bindy-controller-zone = { path = "crates/bindy-controller-zone" }
bindy-controller-records = { path = "crates/bindy-controller-records" }
bindy-scout = { path = "crates/bindy-scout" }
bindy-bootstrap = { path = "crates/bindy-bootstrap" }

kube = { version = "4.0", features = ["runtime", "derive", "client", "jsonpatch"] }
# Direct dependency on the kube-runtime that `kube` re-exports, only to enable
# `unstable-runtime-stream-control`: controllers consume the shared WatchSet
# streams through `Controller::for_stream` / `watches_stream` / `owns_stream`
# (ADR-0009 §3, amended). The `kube` facade only offers the umbrella
# `unstable-runtime`, which would also enable `-subscribe` and `-reconcile-on`;
# this is the only unstable kube feature bindy enables. Keep the version in
# lockstep with `kube`.
kube-runtime = { version = "4.2", features = ["unstable-runtime-stream-control"] }
kube-lease-manager = "0.12"
# Client-side API rate limiting + request-metrics middleware (ADR-0005).
# Already in the tree via kube; direct dep for RateLimitLayer and Layer/Service.
tower = { version = "0.5", features = ["limit", "util"] }
http = "1"
# Response-body wrapper of the non-watch request deadline (ADR-0014). Already
# in the tree through kube and hyper.
http-body = "1"
# JSON Patch construction for atomic finalizer add/remove with `test` guards
# (mirrors kube-runtime's own finalizer helper; same version kube-core uses)
json-patch = "4.2"
# Only include needed tokio features for faster compilation
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1.2"
futures = "0.3"
# Fan-out channel of the shared WatchSet (ADR-0009 §3): backpressure, never
# loss. Already in the tree through kube-runtime, which uses it the same way.
async-broadcast = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
# Parses, validates and writes named.conf (ADR-0013). No `cli` feature: the
# operator never needs hornet's command-line tool.
hornet-bind9 = { version = "0.3", default-features = false }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
k8s-openapi = { version = "0.28", features = ["v1_32", "schemars"] }
# ring-only: use "rustls-no-provider", NOT reqwest's "rustls" feature. The
# latter is an alias for "__rustls-aws-lc-rs", which force-enables the aws-lc-rs
# crypto backend across the whole dependency graph and pulls in aws-lc-sys
# (C/assembly). "rustls-no-provider" leaves the crypto backend unset so reqwest
# uses the process-default provider, which we install as ring in main.rs.
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], default-features = false }
base64 = "0.23"
rand = "0.10"
hickory-net = { version = "0.26.3", features = ["dnssec-ring"] }
hickory-proto = { version = "0.26.3", features = ["dnssec-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Chain-only certificate verification for the bindcar sidecar transport, where
# the peer is dialled by pod IP and has no matching SAN (ADR-0004). Already in
# the lock via rustls; promoted to a direct dep so it can be used explicitly.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
url = "2.5.8"
# Types-only dependency (CreateZoneRequest / ZoneConfig / SoaRecord / ZONE_TYPE_*).
# bindcar 0.7.0's optional `k8s-token-review` feature (default = []) pulls kube 4.0 /
# k8s-openapi 0.28, which now matches the operator's own kube 4.0 / k8s-openapi 0.28 stack.
# Types only: bindy imports ZoneConfig/SoaRecord/DnsRecord/ZoneResponse and the
# ZONE_TYPE_* constants, never the HTTP handlers. `default-features = false`
# drops bindcar's server and TLS stacks (axum, tower-http, utoipa,
# utoipa-swagger-ui, tower_governor, rustls, ring) from bindy's graph.
# See .github/community/25-bindcar-migration-v0-8-0.md section 23.
bindcar = { version = "0.9.0", default-features = false }
prometheus = "0.14"
axum = "0.8"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Dev-only
tempfile = "3"
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
# Faster builds: use fewer codegen units and shared generics
codegen-units = 256
# Incremental compilation (default, but explicit)
incremental = true

# Optimize dependencies in dev builds for better runtime performance
[profile.dev.package."*"]
opt-level = 1
# Keep debug info minimal for dependencies
debug = false

# Fast check profile - for cargo check and IDE support
[profile.dev-fast]
inherits = "dev"
opt-level = 0
debug = false
incremental = true

# Test profile optimizations
[profile.test]
inherits = "dev"
# Optimize tests slightly for faster execution
opt-level = 1
