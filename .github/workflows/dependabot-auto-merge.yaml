#
# Dependabot auto-merge.
#
# On every Dependabot pull request, run the full e2e gate (integration +
# regression, via the reusable e2e.yaml). If it passes:
#   - patch / minor updates  -> enable auto-merge (squash). GitHub then merges
#                               once ALL required status checks (Build, security,
#                               this e2e) are green.
#   - major updates          -> leave the PR OPEN and comment, for manual review.
# If the e2e gate fails (or anything errors), nothing is merged — the PR is left
# open with a comment, which is the desired "leave open for me to investigate"
# fallback. This workflow is fail-safe: it can only ever ENABLE a merge on an
# explicit green run; every other path leaves the PR untouched.
#
# ── Prerequisites (repo settings — one-time, not code) ───────────────────────
#   1. Settings > General > "Allow auto-merge"  ......................  ENABLED
#   2. Branch protection on `main` with required status checks (so `gh pr merge
#      --auto` has gates to wait on before merging).
#   3. Settings > Actions > General > Workflow permissions:
#      "Allow GitHub Actions to create and approve pull requests"  ....  ENABLED
#      (needed for the GITHUB_TOKEN to enable auto-merge on Dependabot PRs).
# ─────────────────────────────────────────────────────────────────────────────

name: Dependabot Auto-merge

# `pull_request_review` is a trigger, not just `pull_request`: a held major sat
# open forever because approving it re-ran nothing. Approval is the sign-off
# the hold was waiting for, so it has to be able to wake this workflow up.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

# Elevated so the auto-injected GITHUB_TOKEN can enable auto-merge / comment on
# the Dependabot PR. (Custom repo/org secrets are still unavailable to
# Dependabot-triggered runs — that is fine, this workflow needs none.)
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Fetch Dependabot metadata
    # Gate on the PR *author* (who opened it), not github.actor (who triggered
    # the run). github.actor flips to a human the moment anyone merges/rebases/
    # pushes to a Dependabot branch, which would skip this and every downstream
    # job. pull_request.user.login stays 'dependabot[bot]' for the PR's life, so
    # auto-merge keeps working after a maintainer merges main in. For any other
    # author this (and every downstream job) is skipped, so the workflow no-ops
    # on human PRs.
    #
    # On a review event, ignore everything except an approval — a
    # `changes_requested` or `commented` review is not a merge signal.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && (github.event_name != 'pull_request_review'
          || github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    outputs:
      update-type: ${{ steps.meta.outputs.update-type }}
      dependency-names: ${{ steps.meta.outputs.dependency-names }}
      auto-merge: ${{ steps.classify.outputs.auto-merge }}
    steps:
      - name: Fetch metadata
        id: meta
        # SHA-pinned to match repo policy; Dependabot's github-actions updater
        # will keep this current.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The single place that decides "may this merge itself?". Both the
      # auto-merge and hold-major jobs branch on this one output so they cannot
      # drift into overlapping or contradictory conditions.
      #
      #   patch / minor  -> yes, unchanged behaviour.
      #
      #   human approval -> yes. A maintainer approving a held PR *is* the
      #                     manual review the hold was waiting for. Before the
      #                     pull_request_review trigger above, approving did
      #                     nothing at all.
      #
      #   SHA-only bump  -> yes. An action pinned to a moving tag with no
      #                     release can never produce a semver delta, and
      #                     fetch-metadata reports that unknown delta as
      #                     `semver-major`. That is a missing version number,
      #                     not a breaking change, so holding it for "manual
      #                     review of the major" reviews nothing. The gate is
      #                     what actually vets these. Detection is deliberately
      #                     dumb and dependency-free: every semver contains a
      #                     dot, no commit SHA does.
      #
      #   otherwise      -> no; held for manual review.
      - name: Classify
        id: classify
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          NEW_VERSION: ${{ steps.meta.outputs.new-version }}
          REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          auto=false
          if [ "$UPDATE_TYPE" != "version-update:semver-major" ]; then
            auto=true
          elif [ "$REVIEW_STATE" = "approved" ]; then
            auto=true
          elif [ -n "$NEW_VERSION" ] && [ "${NEW_VERSION#*.}" = "$NEW_VERSION" ]; then
            auto=true
          fi
          echo "auto-merge=$auto" >> "$GITHUB_OUTPUT"
          echo "update-type=$UPDATE_TYPE new-version=$NEW_VERSION review=${REVIEW_STATE:-none} -> auto-merge=$auto"

  e2e:
    name: E2E gate
    needs: metadata
    # Skipped automatically when `metadata` is skipped (non-Dependabot PR).
    uses: ./.github/workflows/e2e.yaml

  auto-merge:
    name: Enable auto-merge (patch/minor)
    needs: [metadata, e2e]
    # success() ensures BOTH metadata and the e2e gate passed before we ever
    # enable a merge. Major bumps are excluded — held for manual review.
    if: ${{ success() && needs.metadata.outputs.auto-merge == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

  hold-major:
    name: Hold major update for review
    needs: [metadata, e2e]
    # e2e passed but it is a major bump — leave open, tell the reviewer.
    if: ${{ success() && needs.metadata.outputs.auto-merge != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment (major held)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body \
            "✅ e2e (integration + regression) passed, but this is a **major** version update — left open for manual review before merge."

  report-failure:
    name: Report e2e failure
    needs: [metadata, e2e]
    # Any failure in metadata or the e2e gate. Leaves the PR open and flags it.
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment (e2e failed)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body \
            "❌ e2e (integration + regression) failed — auto-merge withheld. Left open for investigation. See the **E2E gate** job for logs."
