name: OpenSSF Scorecard

on:
  # Run on branch protection changes
  branch_protection_rule:
  # Run weekly
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3 AM UTC
  # Allow manual runs
  workflow_dispatch:
  # Run on pushes to main that change security-relevant files
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'crates/*/Cargo.toml'
      - 'Cargo.lock'

# Declare default permissions as read-only
permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to code-scanning dashboard
      security-events: write
      # Needed to publish results
      id-token: write
      # Uncomment the permissions below if installing in a private repository.
      # contents: read
      # actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to OpenSSF REST API for aggregate statistics
          publish_results: true

      # Upload results to GitHub's code scanning dashboard
      - name: Upload SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif

      # Upload results as workflow artifact
      - name: Upload Scorecard results as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 90
