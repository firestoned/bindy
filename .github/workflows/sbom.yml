name: Scheduled SBOM Scan

on:
  schedule:
    # Generate SBOM daily at 2 AM UTC to catch new vulnerabilities
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Daily SBOM generation and vulnerability scan. PR, main and release
  # SBOMs come from the `sbom` job in build.yaml (ADR-0010).
  generate-sbom:
    name: Generate and Verify SBOM (Scheduled)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust build environment
        uses: firestoned/github-actions/rust/setup-rust-build@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          target: x86_64-unknown-linux-gnu

      - name: Generate SBOM
        uses: firestoned/github-actions/rust/generate-sbom@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          package: bindy
          target: x86_64-unknown-linux-gnu
          spec-version: '1.5'
          cyclonedx-version: '0.5.9'

      # Same staging, producer metadata and NTIA gate as the release SBOMs
      # (ADR-0010); fails the run if the SBOM regresses.
      - name: Stage, annotate and gate the SBOM
        run: make sbom-stage SBOM_NAME=bindy-linux-amd64

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom/bindy-linux-amd64.cdx.json
          retention-days: 90
          if-no-files-found: error

      # Daily CBOM regeneration (ADR-0011): re-stamps the curated template
      # against main's Cargo.lock, so a crypto dependency drifting out of
      # the lockfile surfaces here even between PRs.
      - name: Generate and gate the CBOM
        run: make cbom-stage

      - name: Upload CBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cbom
          path: sbom/bindy-cbom.cdx.json
          retention-days: 90
          if-no-files-found: error

      # SBOMs are not committed (unsigned commits would violate C-1). They
      # ship as release assets, as signed SBOM attestations, and as these
      # artifacts.

  scan-sbom:
    name: Scan SBOM for Vulnerabilities
    runs-on: ubuntu-latest
    needs: generate-sbom

    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom

      # Report-only, as before: cargo-audit in the Build workflow is the
      # blocking advisory gate.
      - name: Scan SBOM with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: bindy-linux-amd64.cdx.json
          fail-build: false
          severity-cutoff: medium
          output-format: table
