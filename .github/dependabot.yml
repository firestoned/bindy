# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust dependencies (Cargo.toml)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    reviewers:
      - "firestoned"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group all updates together: one weekly PR for kube-ecosystem (which must
    # move as a unit) and one for everything else, instead of a PR per crate.
    groups:
      # The kube ecosystem is tightly version-coupled: kube 4.x requires
      # k8s-openapi 0.28, and kube-lease-manager pins a specific kube minor.
      # Bumping any one of them alone produces two incompatible k8s-openapi
      # copies (the new one has no v1_* feature enabled), which breaks the
      # build. Group them — including majors — so they always move together
      # in a single, coherent PR. Must precede the catch-all group below.
      kube-ecosystem:
        patterns:
          - "kube"
          - "kube-*"
          - "k8s-openapi"
        update-types:
          - "major"
          - "minor"
          - "patch"
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "firestoned"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    # Group all action bumps into a single weekly PR — one CI cycle instead of
    # a serialized chain (the main ruleset requires up-to-date branches, so N
    # separate PRs cost N full CI runs).
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "firestoned"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
      include: "scope"
